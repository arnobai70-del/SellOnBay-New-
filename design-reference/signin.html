<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SellOnBay — Sign in</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#2B4250;background:#EDF3F6;-webkit-font-smoothing:antialiased}
a{color:#1A5444}a:hover{color:#13453A}
.page{min-height:100%;padding:20px 0 56px;box-sizing:border-box;background:radial-gradient(900px 520px at 8% -6%,#D9EDF5 0%,rgba(217,237,245,0) 62%),radial-gradient(820px 520px at 96% 8%,#DCF2E9 0%,rgba(220,242,233,0) 60%),#EDF3F6}
.glass{background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(43,66,80,.06);border-radius:22px}
.logo{font-weight:600;font-size:17px;color:#2B4250;text-decoration:none;display:flex;align-items:center;gap:10px}
.dot{width:24px;height:24px;border-radius:8px;background:#CDEBDF;border:1px solid #fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;background:#CDEBDF;color:#1A5444;font:500 14px 'Inter',sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.9);cursor:pointer;box-sizing:border-box;width:100%}
.btn:hover{background:#BDE3D4;color:#13453A}
.btn.ghost{background:rgba(255,255,255,.72);border:1px solid #D3E2E9;color:#2B4250}
.muted{color:#566C78}
h1{font-weight:300;margin:0;letter-spacing:-.015em}
.field label{display:block;font-size:13px;color:#3D5563;margin-bottom:6px}
.input{width:100%;box-sizing:border-box;min-height:46px;border-radius:12px;border:1px solid #D3E2E9;background:rgba(255,255,255,.85);padding:0 14px;font:14px 'Inter',sans-serif;color:#2B4250}
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid #DCE7EC}
.seg button{flex:1;min-height:40px;border-radius:999px;border:0;background:transparent;font:14px 'Inter',sans-serif;color:#566C78;cursor:pointer}
.seg button.on{background:#fff;color:#2B4250;box-shadow:0 2px 8px rgba(43,66,80,.08)}
@keyframes sob-rise{from{opacity:0;transform:translateY(36px) scale(.97);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes sob-drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(160px,100px) scale(1.2)}}
@keyframes sob-drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-140px,-60px) scale(.9)}}
@keyframes sob-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page{position:relative;overflow:hidden;isolation:isolate}
.page::before,.page::after{content:"";position:absolute;z-index:-1;width:680px;height:680px;border-radius:50%;filter:blur(90px);opacity:.7;pointer-events:none}
.page::before{top:-120px;left:10%;background:#CBE6F2;animation:sob-drift1 18s ease-in-out infinite}
.page::after{bottom:-260px;right:8%;background:#CFEFE2;animation:sob-drift2 22s ease-in-out infinite}
.glass{animation:sob-rise 1.3s cubic-bezier(.16,1,.3,1) .15s both}
.glass > *{animation:sob-in .7s cubic-bezier(.2,.8,.2,1) both}
.glass > :nth-child(1){animation-delay:.5s}.glass > :nth-child(2){animation-delay:.58s}.glass > :nth-child(3){animation-delay:.66s}.glass > :nth-child(4){animation-delay:.74s}.glass > :nth-child(5){animation-delay:.82s}.glass > :nth-child(6){animation-delay:.9s}.glass > :nth-child(7){animation-delay:.98s}.glass > :nth-child(8){animation-delay:1.06s}.glass > :nth-child(9){animation-delay:1.14s}
.seg button{transition:background .35s,color .35s,box-shadow .35s}
.input{transition:border-color .3s,box-shadow .3s}.input:focus{outline:none;border-color:#7FBFA9;box-shadow:0 0 0 4px rgba(127,191,169,.18)}
.btn{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(63,143,119,.18)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<style>html,body{height:100%}input,select,textarea,button{font-family:inherit}</style>
</head>
<body>


<div class="page">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 32px"><a class="logo" href="index.html" style="padding: 18px 0"><span class="dot" aria-hidden="true"></span>SellOnBay</a></div>
<div style="display: flex; justify-content: center; padding: 48px 20px 0">
<form class="glass" style="width: 100%; max-width: 440px; padding: 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<h1 style="font-size: 30px">Welcome back</h1>
<div class="muted" style="font-size: 14px; margin-top: -6px">Buy safely with escrow, or sell and keep 78%.</div>
<div class="seg" role="tablist"><button type="button" class="on" onclick="">Sign in</button><button type="button" class="" onclick="">Create account</button></div>

<div class="field"><label for="em">Email</label><input id="em" class="input" type="email" placeholder="you@example.com"></div>
<div class="field"><label for="pw">Password</label><input id="pw" class="input" type="password"></div>


<a href="account-access.html" style="font-size: 13px; align-self: flex-end">Forgot password?</a>

<a class="btn" href="buyer.html">Sign in</a>
<div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #566C78"><span style="flex: 1; height: 1px; background: #DCE7EC"></span>or<span style="flex: 1; height: 1px; background: #DCE7EC"></span></div>
<a class="btn ghost" href="buyer.html">Continue with Google</a>
</form>
</div>
</div>

</body>
</html>
